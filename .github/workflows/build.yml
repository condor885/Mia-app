name: Crea APK

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Scarica il tuo progetto
        run: curl -L https://files.catbox.moe/t7yez1.zip -o project.zip

      - name: Estrai progetto
        run: |
          unzip -q project.zip
          rm project.zip
          mv V3SP3R-main/* . 2>/dev/null || true
          mv V3SP3R-main/.* . 2>/dev/null || true
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Crea APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: Mia-App-APK
          path: '**/build/outputs/apk/debug/*.apk'
