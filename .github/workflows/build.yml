name: Crea APK

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Scarica progetto
        run: |
          curl -L https://tmpfiles.org/dl/wpAzMZwTnqJI/v3sp3r-main.zip -o project.zip
          ls -lh project.zip
          file project.zip

      - name: Estrai progetto
        run: |
          unzip -q project.zip
          rm project.zip
          if [ -d "V3SP3R-main" ]; then
            shopt -s dotglob
            mv V3SP3R-main/* . || true
            rm -rf V3SP3R-main
          fi
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Crea APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: Mia-App-APK
          path: app/build/outputs/apk/debug/*.apk
